<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="50%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#b388ff" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="100%" stop-color="#020205" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#neonGlow)" stroke-width="6" opacity="0.6" />

  <!-- Outer Glowing Image Frame -->
  <rect x="96" y="96" width="320" height="320" rx="36" fill="rgba(0, 255, 136, 0.04)" stroke="url(#neonGlow)" stroke-width="12" filter="url(#glow)"/>

  <!-- Mountain Peaks & Sun (Photo Icon) -->
  <circle cx="180" cy="180" r="32" fill="#00ff88" opacity="0.9" />
  <path d="M120 370 L210 260 L270 320 L330 240 L400 370 Z" fill="url(#neonGlow)" opacity="0.85" />

  <!-- Compression Arrows Converging in Center -->
  <!-- Top Arrow pointing down -->
  <path d="M256 60 L256 120 M236 100 L256 120 L276 100" fill="none" stroke="#00ff88" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom Arrow pointing up -->
  <path d="M256 452 L256 392 M236 412 L256 392 L276 412" fill="none" stroke="#00d4ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Left Arrow pointing right -->
  <path d="M60 256 L120 256 M100 236 L120 256 L100 276" fill="none" stroke="#00ff88" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right Arrow pointing left -->
  <path d="M452 256 L392 256 M412 236 L392 256 L412 276" fill="none" stroke="#b388ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Badge 4U text at bottom right corner -->
  <rect x="330" y="340" width="110" height="48" rx="14" fill="#05050a" stroke="#00ff88" stroke-width="3" />
  <text x="385" y="373" font-family="'Orbitron', sans-serif, system-ui" font-size="24" font-weight="900" fill="#00ff88" text-anchor="middle">PRO</text>
</svg>
